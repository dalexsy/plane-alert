<div class="pushover-config-editor">
  <div class="header">
    <h3>Push Notification Configuration</h3>
    <button type="button" class="close-btn" (click)="close()" title="Close">✕</button>
  </div>
  <p class="description">Configure push notifications for military aircraft alerts.</p>

  <div class="filter-sections">
    <app-pushover-form-sections
      [state]="state"
      (customFilterChange)="onCustomFilterChange()"
    />
    <app-pushover-type-grid [state]="state" (stateChange)="onStateChange()" />
  </div>

  <div class="actions">
    <button type="button" class="save-btn" (click)="save()">Save Configuration</button>
    <button type="button" class="cancel-btn" (click)="close()">Cancel</button>
  </div>

  @if (statusMessage) {
    <div class="status-message">{{ statusMessage }}</div>
  }
</div>
