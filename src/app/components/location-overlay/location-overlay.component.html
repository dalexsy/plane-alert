<div
  *ngIf="plane && (hasAirportInfo || district)"
  class="location-overlay"
  [class.selected]="isSelected"
  [class.military-plane]="isSelected && plane.isMilitary"
  [class.special-plane]="isSelected && plane.isSpecial"
  (click)="onClick()"
  title="Center plane"
>
  <app-icon
    icon="location_on"
    variant="sharp"
    size="small"
    ariaLabel="Plane location"
  ></app-icon>
  <!-- If at an airport and grounded or under 200m, show airportName -->
  <ng-container *ngIf="hasAirportInfo">
    <span class="airport-name">{{ plane.airportName }}</span>
  </ng-container>
  <!-- Otherwise, show district only if it has data -->
  <ng-container *ngIf="!plane.airportName && district">
    <span class="district">{{ district }}</span>
  </ng-container>
</div>
