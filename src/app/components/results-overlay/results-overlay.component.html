<div
  class="results-overlay"
  [class.collapsed]="facade.collapsed"
  [class.window-view-closed]="!settings.showWindowView"
>
  <div class="top-buttons">
    <app-results-toolbar
      [facade]="facade"
      [showAltitudeBorders]="showAltitudeBorders"
      [showWindDirection]="showWindDirection"
      [showSunDirection]="showSunDirection"
      (altitudeBordersChange)="altitudeBordersChange.emit($event)"
      (windDirectionToggleChange)="windDirectionToggleChange.emit($event)"
      (sunDirectionToggleChange)="sunDirectionToggleChange.emit($event)"
      (toggleOtherControls)="facade.toggleOtherControls(cdr)"
      (toggleCollapsed)="facade.toggleCollapsed(cdr)"
      (toggleCommercialFilter)="facade.toggleCommercialFilter()"
      (toggleMilitaryMute)="facade.toggleMilitaryMute()"
      (toggleShuffle)="facade.toggleShuffle(cdr)"
      (toggleNearest)="facade.toggleNearest(cdr)"
      (toggleMilitaryPriority)="facade.toggleMilitaryPriority(cdr)"
      (configurePushover)="facade.showPushoverConfig = true"
      (openMilitaryHistory)="facade.showMilitaryHistory = true"
      (toggleWindowView)="toggleWindowView()"
    ></app-results-toolbar>
  </div>

  <ng-container *ngIf="!facade.collapsed">
    <div class="middle-section">
      <app-results-sky-list
        [planes]="facade.filteredSkyPlaneLog"
        [loadingAirports]="loadingAirports"
        [highlightedPlaneIcao]="highlightedPlaneIcao"
        [hoveredPlaneIcao]="facade.hoveredSkyPlaneIcao"
        [now]="facade.now"
        [activePlaneIcaos]="activePlaneIcaos"
        [clickedAirports]="clickedAirports"
        [airportCircles]="airportCircles"
        [scrollable]="facade.skyListScrollable"
        [atBottom]="facade.skyListAtBottom"
        (scrollChange)="onSkyScroll($event)"
        (centerPlane)="centerPlane.emit($event)"
        (centerAirport)="centerAirport.emit($event)"
        (filterPrefix)="filterPrefix.emit($event)"
        (toggleSpecial)="onToggleSpecial($event)"
        (hoverPlane)="onHoverPlane($event, 'sky')"
        (unhoverPlane)="onUnhoverPlane($event, 'sky')"
      ></app-results-sky-list>
    </div>

    <app-results-seen-list
      [seenLog]="seenPlaneLog"
      [filteredLog]="facade.filteredSeenPlaneLog"
      [collapsed]="facade.seenCollapsed"
      [highlightedPlaneIcao]="highlightedPlaneIcao"
      [hoveredPlaneIcao]="facade.hoveredSeenPlaneIcao"
      [now]="facade.now"
      [activePlaneIcaos]="activePlaneIcaos"
      [clickedAirports]="clickedAirports"
      [airportCircles]="airportCircles"
      [scrollable]="facade.seenListScrollable"
      [atBottom]="facade.seenListAtBottom"
      (toggleCollapsed)="onToggleSeenCollapsed()"
      (clearHistorical)="clearHistoricalList.emit()"
      (scrollChange)="onSeenScroll($event)"
      (centerPlane)="centerPlane.emit($event)"
      (filterPrefix)="filterPrefix.emit($event)"
      (toggleSpecial)="onToggleSpecial($event)"
      (hoverPlane)="onHoverPlane($event, 'seen')"
      (unhoverPlane)="onUnhoverPlane($event, 'seen')"
    ></app-results-seen-list>
  </ng-container>
</div>

<div
  class="pushover-config-backdrop"
  *ngIf="facade.showPushoverConfig"
  (click)="facade.showPushoverConfig = false"
></div>
<app-pushover-config-editor
  *ngIf="facade.showPushoverConfig"
  (closeEditor)="facade.showPushoverConfig = false"
  (configSaved)="onPushoverConfigSaved($event)"
></app-pushover-config-editor>

<div
  class="military-history-backdrop"
  *ngIf="facade.showMilitaryHistory"
  (click)="facade.showMilitaryHistory = false"
></div>
<app-military-history-panel
  *ngIf="facade.showMilitaryHistory"
  (close)="facade.showMilitaryHistory = false"
></app-military-history-panel>
