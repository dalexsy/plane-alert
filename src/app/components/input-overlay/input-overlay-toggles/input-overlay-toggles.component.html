<app-tab side="left">
  <app-button
    class="toggle-other-controls"
    icon="arrow_drop_down"
    type="tertiary"
    size="medium"
    [ariaLabel]="facade.otherControlsHidden ? 'Show controls' : 'Hide controls'"
    [appTooltip]="facade.otherControlsHidden ? 'Show controls' : 'Hide controls'"
    (click)="toggleOtherControls.emit()"
  ></app-button>
  <!-- Full icon stack whenever the options panel is open; hide only when
       panel is collapsed AND user chose "hide controls". -->
  <ng-container *ngIf="!facade.collapsed || !facade.otherControlsHidden">
    <app-button
      class="collapse-toggle"
      [icon]="facade.collapsed ? 'left_panel_open' : 'left_panel_close'"
      type="tertiary"
      size="medium"
      [ariaLabel]="collapseTooltip"
      [appTooltip]="collapseTooltip"
      tooltipPosition="right"
      (click)="toggleCollapsed.emit()"
    ></app-button>
    <app-button
      class="toggle-datetime"
      [icon]="showDateTime ? 'schedule' : 'history_toggle_off'"
      type="tertiary"
      size="medium"
      [ariaLabel]="dateTimeTooltip"
      [appTooltip]="dateTimeTooltip"
      (click)="toggleDateTimeOverlays.emit()"
    ></app-button>
    <div class="brightness-button-wrapper" [class.auto]="brightnessState?.mode === 'auto'">
      <app-button
        class="toggle-brightness"
        [icon]="brightnessIcon"
        type="tertiary"
        size="medium"
        [ariaLabel]="sunStatusTooltip"
        [appTooltip]="sunStatusTooltip"
        (click)="brightnessToggle.emit()"
      ></app-button>
    </div>
    <app-button
      class="toggle-airport-labels"
      [icon]="showAirportLabels ? 'label' : 'label_off'"
      type="tertiary"
      size="medium"
      [ariaLabel]="airportLabelsTooltip"
      [appTooltip]="airportLabelsTooltip"
      (click)="toggleAirportLabels.emit()"
    ></app-button>
    <app-button
      class="toggle-cloud-cover"
      [icon]="showCloudCover ? 'cloud' : 'cloud_off'"
      type="tertiary"
      size="medium"
      [ariaLabel]="cloudCoverTooltip"
      [appTooltip]="cloudCoverTooltip"
      (click)="cloudToggleChange.emit(!showCloudCover)"
    ></app-button>
    <app-button
      class="toggle-rain-cover"
      [icon]="showRainCover ? 'rainy_heavy' : 'rainy_snow'"
      type="tertiary"
      size="medium"
      [ariaLabel]="rainCoverTooltip"
      [appTooltip]="rainCoverTooltip"
      (click)="rainToggleChange.emit(!showRainCover)"
    ></app-button>
    <app-button
      class="toggle-view-axes"
      [icon]="showViewAxes ? 'target' : 'filter_tilt_shift'"
      type="tertiary"
      size="medium"
      [ariaLabel]="viewAxesTooltip"
      [appTooltip]="viewAxesTooltip"
      (click)="coneVisibilityChange.emit(!showViewAxes)"
    ></app-button>
    <app-button
      class="cone-config"
      icon="settings"
      type="tertiary"
      size="medium"
      ariaLabel="Configure view cones"
      appTooltip="Configure view cones"
      (click)="coneConfigChange.emit()"
    ></app-button>
    <app-button
      class="toggle-animations"
      [icon]="animationsEnabled ? 'motion_photos_paused' : 'motion_play'"
      type="tertiary"
      size="medium"
      [ariaLabel]="animationsTooltip"
      [appTooltip]="animationsTooltip"
      (click)="onToggleAnimations()"
    ></app-button>
    <app-button
      *ngIf="animationsEnabled"
      class="toggle-ghost-position"
      [icon]="showGhostPosition ? 'gps_fixed' : 'gps_not_fixed'"
      type="tertiary"
      size="medium"
      [ariaLabel]="ghostPositionTooltip"
      [appTooltip]="ghostPositionTooltip"
      (click)="onToggleGhostPosition()"
    ></app-button>
    <app-button
      class="go-home"
      icon="home"
      type="tertiary"
      size="medium"
      ariaLabel="Go to home"
      appTooltip="Go to home"
      (click)="goToHome.emit()"
    ></app-button>
    <app-button
      class="force-scan"
      icon="refresh"
      type="tertiary"
      size="medium"
      ariaLabel="Force scan now"
      appTooltip="Force scan now"
      (click)="resolveAndUpdate.emit($event)"
    ></app-button>
    <app-button
      class="zoom-in"
      icon="add"
      type="tertiary"
      size="medium"
      ariaLabel="Zoom in"
      appTooltip="Zoom in"
      (click)="zoomIn.emit()"
    ></app-button>
    <app-button
      class="zoom-out"
      icon="remove"
      type="tertiary"
      size="medium"
      ariaLabel="Zoom out"
      appTooltip="Zoom out"
      (click)="zoomOut.emit()"
    ></app-button>
  </ng-container>
</app-tab>
