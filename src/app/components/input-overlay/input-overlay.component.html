<div class="options-overlay" [class.collapsed]="facade.collapsed">
  <div class="top-buttons">
    <app-input-overlay-toggles
      [facade]="facade"
      [showDateTime]="showDateTime"
      [brightnessState]="brightnessState"
      [showAirportLabels]="showAirportLabels"
      [showCloudCover]="showCloudCover"
      [showRainCover]="showRainCover"
      [showViewAxes]="showViewAxes"
      [animationsEnabled]="animationsEnabled"
      (toggleOtherControls)="facade.toggleOtherControls(cdr)"
      (toggleCollapsed)="facade.toggleCollapsed(cdr)"
      (toggleDateTimeOverlays)="toggleDateTimeOverlays.emit()"
      (brightnessToggle)="brightnessToggle.emit()"
      (toggleAirportLabels)="toggleAirportLabels.emit()"
      (cloudToggleChange)="cloudToggleChange.emit($event)"
      (rainToggleChange)="rainToggleChange.emit($event)"
      (coneVisibilityChange)="coneVisibilityChange.emit($event)"
      (coneConfigChange)="coneConfigChange.emit()"
      (animationsEnabledChange)="animationsEnabledChange.emit($event)"
      (goToHome)="goToHome.emit()"
      (resolveAndUpdate)="onResolveAndUpdate()"
      (zoomIn)="zoomIn.emit()"
      (zoomOut)="zoomOut.emit()"
    ></app-input-overlay-toggles>
  </div>
  <app-input-overlay-form
    *ngIf="!facade.collapsed"
    [facade]="facade"
    (resolveAndUpdate)="onResolveAndUpdate()"
    (useCurrentLocation)="useCurrentLocation.emit()"
    (setHome)="setHome.emit()"
    (goToHome)="goToHome.emit()"
    (distanceUnitChanged)="distanceUnitChanged.emit($event)"
  ></app-input-overlay-form>
</div>
