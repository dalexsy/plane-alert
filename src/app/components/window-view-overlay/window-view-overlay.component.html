<div
  class="window-view-overlay"
  [ngClass]="{ daytime: isDaytime() }"
  (contextmenu)="$event.stopPropagation()"
  [style.background]="sky.skyBackground"
>
  <app-sky-background
    [windowCloudUrl]="sky.windowCloudUrl"
    [cloudFilter]="sky.cloudFilter"
    [cloudBacklightClass]="sky.cloudBacklightClass"
  ></app-sky-background>
  <app-sun-sky-gradient
    [sun]="getSunObject()"
    [isDaytime]="isDaytime()"
    [sunElevationAngle]="getSunElevationAngle()"
    [bottomPosition]="getSunGradientBottomPosition()"
  ></app-sun-sky-gradient>
  <app-rain-overlay></app-rain-overlay>
  <app-swallow-animation
    [pressureIntensity]="0.8"
    [isStormApproaching]="true"
    [animationsEnabled]="animationsEnabled"
  ></app-swallow-animation>
  <app-fall-leaves-animation
    [isAutumn]="true"
    [animationsEnabled]="animationsEnabled"
    [windSpeed]="sky.currentWindSpeed"
    [windStat]="windStat"
  ></app-fall-leaves-animation>
  <app-compass-labels
    [compassBackground]="compass.compassBackground"
    [chimneyBackground]="compass.chimneyBackground"
  ></app-compass-labels>
  <app-marker-lines [markerPlanes]="getMarkerPlanes()"></app-marker-lines>
  <app-altitude-bands [altitudeTicks]="altitudeTicks"></app-altitude-bands>
  <app-dim-overlay
    [dimSegments]="dimSegments"
    [brightnessState]="brightnessState"
  ></app-dim-overlay>
  <app-celestial-objects
    [celestialObjects]="getCelestialObjects()"
    [isDaytime]="isDaytime()"
  ></app-celestial-objects>
  <app-aircraft-container
    [aircraftPlanes]="getAircraftPlanes()"
    [highlightedPlaneIcao]="highlightedPlaneIcao"
    [showAltitudeBorders]="showAltitudeBorders"
    [skyBottomColor]="sky.skyBottomColor"
    [skyTopColor]="sky.skyTopColor"
    (selectPlane)="handlePlaneSelection($event)"
  ></app-aircraft-container>
</div>
