<div class="fall-leaves-container" [class.spring-petals]="isSpringPetals">
  <div
    *ngFor="let leaf of leaves; trackBy: trackByLeafId"
    class="leaf"
    [ngClass]="[getLeafSizeClass(leaf), leaf.colorType]"
    [ngStyle]="getLeafPosition(leaf)"
    [style.--fall-delay]="leaf.fallDelay + 's'"
    [style.--sway-delay]="leaf.swayDelay + 's'"
    [style.--rotate-delay]="leaf.rotateDelay + 's'"
  >
    <div class="leaf-shape"></div>
  </div>
</div>
