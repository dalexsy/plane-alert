<app-tab side="right">
  <app-button
    class="toggle-other-controls"
    icon="arrow_drop_down"
    type="tertiary"
    size="medium"
    [ariaLabel]="facade.otherControlsHidden ? 'Show controls' : 'Hide controls'"
    [attr.data-tooltip]="facade.otherControlsHidden ? 'Show controls' : 'Hide controls'"
    (click)="toggleOtherControls.emit()"
  ></app-button>
  <!-- Full icon stack when results panel is open, or when user has not hidden controls -->
  <ng-container *ngIf="!facade.collapsed || !facade.otherControlsHidden">
    <app-button
      class="collapse-toggle"
      [icon]="facade.collapsed ? 'right_panel_open' : 'right_panel_close'"
      type="tertiary"
      size="medium"
      [ariaLabel]="collapseTooltip"
      [attr.data-tooltip]="collapseTooltip"
      (click)="toggleCollapsed.emit()"
    ></app-button>
    <app-button
      [icon]="settings.excludeDiscount ? 'visibility_off' : 'visibility'"
      type="tertiary"
      size="medium"
      [ariaLabel]="commercialFilterTooltip"
      [attr.data-tooltip]="commercialFilterTooltip"
      (click)="toggleCommercialFilter.emit()"
    ></app-button>
    <app-button
      class="military-mute-toggle"
      [icon]="facade.militaryMute ? 'volume_off' : 'volume_up'"
      type="tertiary"
      size="medium"
      [ariaLabel]="militaryMuteTooltip"
      [attr.data-tooltip]="militaryMuteTooltip"
      [ngClass]="{ active: facade.militaryMute }"
      (click)="toggleMilitaryMute.emit()"
    ></app-button>
    <app-button
      class="toggle-altitude-borders"
      [icon]="showAltitudeBorders ? 'dropper_eye' : 'colorize'"
      type="tertiary"
      size="medium"
      [ariaLabel]="altitudeBordersTooltip"
      [attr.data-tooltip]="altitudeBordersTooltip"
      (click)="altitudeBordersChange.emit(!showAltitudeBorders)"
    ></app-button>
    <app-button
      class="toggle-wind-direction"
      icon="air"
      type="tertiary"
      size="medium"
      [ariaLabel]="windDirectionTooltip"
      [attr.data-tooltip]="windDirectionTooltip"
      (click)="windDirectionToggleChange.emit(!showWindDirection)"
    ></app-button>
    <app-button
      class="toggle-sun-direction"
      icon="wb_sunny"
      type="tertiary"
      size="medium"
      [ariaLabel]="sunDirectionTooltip"
      [attr.data-tooltip]="sunDirectionTooltip"
      (click)="sunDirectionToggleChange.emit(!showSunDirection)"
    ></app-button>
    <app-button
      class="shuffle-toggle"
      [icon]="facade.shuffleMode ? 'pause' : 'shuffle'"
      type="tertiary"
      size="medium"
      [ariaLabel]="shuffleTooltip"
      [attr.data-tooltip]="shuffleTooltip"
      [ngClass]="{ active: facade.shuffleMode }"
      (click)="toggleShuffle.emit()"
    ></app-button>
    <app-button
      class="nearest-toggle"
      [icon]="facade.nearestMode ? 'my_location' : 'location_searching'"
      type="tertiary"
      size="medium"
      [ariaLabel]="nearestTooltip"
      [attr.data-tooltip]="nearestTooltip"
      [ngClass]="{ active: facade.nearestMode }"
      (click)="toggleNearest.emit()"
    ></app-button>
    <div class="military-toggle-wrapper">
      <app-button
        class="military-priority-toggle"
        [icon]="facade.militaryPriority ? 'star_shine' : 'star'"
        type="tertiary"
        size="medium"
        [ariaLabel]="militaryPriorityTooltip"
        [attr.data-tooltip]="militaryPriorityTooltip"
        [ngClass]="{ active: facade.militaryPriority }"
        (click)="toggleMilitaryPriority.emit()"
      ></app-button>
      <span class="military-badge">{{ facade.militaryCount }}</span>
    </div>
    <app-button
      class="setup-pushover"
      icon="notifications_active"
      type="tertiary"
      size="medium"
      ariaLabel="Configure push notifications"
      attr.data-tooltip="Configure push notifications"
      (click)="configurePushover.emit()"
    ></app-button>
    <app-button
      class="military-history"
      icon="history"
      type="tertiary"
      size="medium"
      ariaLabel="View military aircraft history"
      attr.data-tooltip="View military aircraft history"
      (click)="openMilitaryHistory.emit()"
    ></app-button>
    <app-button
      *ngIf="!kiosk"
      class="antenna-sightings"
      icon="cell_tower"
      type="tertiary"
      size="medium"
      ariaLabel="Antenna sightings"
      attr.data-tooltip="Antenna sightings"
      (click)="openSightings()"
    ></app-button>
    <app-button
      class="window-view-toggle"
      icon="window_closed"
      type="tertiary"
      size="medium"
      ariaLabel="Toggle window view overlay"
      [attr.data-tooltip]="facade.showWindowView ? 'Hide window view' : 'Show window view'"
      (click)="toggleWindowView.emit()"
    ></app-button>
  </ng-container>
</app-tab>
