<div
  *ngIf="!loading"
  class="temperature-container"
  [class.window-view-hidden]="windowViewHidden"
>
  <div class="temperature-row">
    <app-icon
      [icon]="weatherIcon"
      variant="outlined"
      size="medium"
      class="weather-icon"
      ariaLabel="Current weather"
    ></app-icon>
    <div class="temp-high">{{ displayHighTemp }}°</div>
    <div class="temp-low">{{ displayLowTemp }}°</div>
  </div>
  <div class="temperature-current">{{ displayTemperature }}°</div>
</div>
