<div
  class="temperature-container"
  [class.window-view-hidden]="windowViewHidden"
>
  <div class="temperature-row">
    <app-icon
      [icon]="weatherIcon"
      variant="outlined"
      size="medium"
      class="weather-icon"
      ariaLabel="Current weather"
    ></app-icon>
    <div class="temperature-meta">
      <div class="cloud-ceiling">
        <app-icon
          icon="wb_cloudy"
          variant="outlined"
          size="small"
          class="cloud-ceiling-icon"
          ariaLabel="Cloud ceiling"
        ></app-icon>
        <span class="cloud-ceiling-value">{{ displayCloudCeiling }}</span>
      </div>
      <div class="temperature-range-row">
        <div class="temp-high">{{ displayHighTemp }}°</div>
        <div class="temp-low">{{ displayLowTemp }}°</div>
      </div>
    </div>
  </div>
  <div class="temperature-current">{{ displayTemperature }}°</div>
</div>
