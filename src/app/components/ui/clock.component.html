<div class="clock-container" [class.window-view-hidden]="windowViewHidden">
  <div class="date-overlay">
    <span class="weekday">{{ weekday }} </span>
    <br class="responsive-break" />
    <span class="day-month">{{ dayMonth }}</span>
  </div>
  <div class="time-overlay">{{ currentTime }}</div>
</div>
