<svg class="map-pattern-defs" width="0" height="0">
  <defs>
    <pattern
      id="airportStripedPatternCyan"
      patternUnits="userSpaceOnUse"
      width="5"
      height="5"
      patternTransform="rotate(45)"
    >
      <line x1="0" y1="0" x2="0" y2="5" stroke="cyan" stroke-width="5" />
    </pattern>
    <pattern
      id="airportStripedPatternGold"
      patternUnits="userSpaceOnUse"
      width="5"
      height="5"
      patternTransform="rotate(45)"
    >
      <line x1="0" y1="0" x2="0" y2="5" stroke="gold" stroke-width="5" />
    </pattern>
  </defs>
</svg>

<div id="map"></div>

<app-cone
  *ngIf="map && uiState.coneVisible"
  [map]="map"
  [lat]="facade.isAtHome && facade.homeLocationValue ? facade.homeLocationValue.lat : facade.currentLat"
  [lon]="facade.isAtHome && facade.homeLocationValue ? facade.homeLocationValue.lon : facade.currentLon"
  [distanceKm]="facade.radiusKm"
  [viewCones]="facade.isAtHome ? viewConesConfig : []"
></app-cone>

<app-cone-config-editor
  *ngIf="showConeConfigEditor"
  [cones]="viewConesConfig"
  (conesChange)="onConeConfigChange($event)"
  (closeEditor)="facade.onConeConfig()"
></app-cone-config-editor>
