<!-- SVG definitions for airport circle patterns -->
<svg width="0" height="0" style="position: absolute">
  <defs>
    <pattern
      id="airportStripedPatternCyan"
      patternUnits="userSpaceOnUse"
      width="5"
      height="5"
      patternTransform="rotate(45)"
    >
      <line x1="0" y1="0" x2="0" y2="5" style="stroke: cyan; stroke-width: 5" />
    </pattern>
    <pattern
      id="airportStripedPatternGold"
      patternUnits="userSpaceOnUse"
      width="5"
      height="5"
      patternTransform="rotate(45)"
    >
      <line x1="0" y1="0" x2="0" y2="5" style="stroke: gold; stroke-width: 5" />
    </pattern>
  </defs>
</svg>

<div class="overlay-container">
  <app-closest-plane-overlay
    *ngIf="overlay.closestPlane"
    [plane]="overlay.closestPlane"
    [operator]="overlay.closestOperator"
    (selectPlane)="followNearestPlane($event)"
    [isSelected]="overlay.closestPlane.icao === overlay.highlightedPlaneIcao"
  ></app-closest-plane-overlay>

  <app-location-overlay
    [plane]="overlay.closestPlane"
    [street]="overlay.locationStreet"
    [district]="overlay.locationDistrict"
    (selectPlane)="followNearestPlane($event)"
    [isSelected]="overlay.closestPlane?.icao === overlay.highlightedPlaneIcao"
  ></app-location-overlay>
</div>

<app-input-overlay
  (resolveAndUpdate)="facade.resolveAndUpdateFromAddress(inputOverlayComponent)"
  (excludeDiscountChange)="facade.onExcludeDiscountChange()"
  (useCurrentLocation)="facade.useCurrentLocation(inputOverlayComponent)"
  (coneVisibilityChange)="facade.toggleConeVisibility($event, cdr)"
  (coneConfigChange)="facade.onConeConfig()"
  (cloudToggleChange)="facade.toggleCloudCover($event)"
  (rainToggleChange)="facade.toggleRainCover($event)"
  (setHome)="facade.setCurrentAsHome()"
  (goToHome)="facade.goToHome(inputOverlayComponent)"
  (toggleDateTimeOverlays)="facade.onToggleDateTimeOverlays()"
  (brightnessToggle)="facade.toggleBrightness()"
  (zoomIn)="facade.onZoomIn()"
  (zoomOut)="facade.onZoomOut()"
  [brightness]="brightnessDisplay.brightness"
  [brightnessState]="brightnessDisplay.brightnessState"
  [showViewAxes]="uiState.coneVisible"
  [showDateTime]="uiState.showDateTime"
  [showCloudCover]="uiState.cloudVisible"
  [showRainCover]="uiState.rainVisible"
  [showAirportLabels]="uiState.showAirportLabels"
  [showAltitudeBorders]="uiState.showAltitudeBorders"
  (toggleAirportLabels)="facade.onToggleAirportLabels()"
  (altitudeBordersChange)="facade.onToggleAltitudeBorders($event, cdr)"
  [animationsEnabled]="uiState.animationsEnabled"
  (animationsEnabledChange)="facade.onToggleAnimations($event, cdr)"
></app-input-overlay>

<app-results-overlay
  (windowViewToggle)="facade.onWindowViewToggle($event)"
  [skyPlaneLog]="overlay.skyPlaneLog"
  [airportPlaneLog]="overlay.airportPlaneLog"
  [seenPlaneLog]="overlay.seenPlaneLog"
  [loadingAirports]="loadingAirports"
  [highlightedPlaneIcao]="overlay.highlightedPlaneIcao"
  [activePlaneIcaos]="overlay.activePlaneIcaos"
  [clickedAirports]="overlay.clickedAirports"
  [airportCircles]="overlay.airportCircles"
  [showAltitudeBorders]="uiState.showAltitudeBorders"
  [showWindDirection]="uiState.showWindDirection"
  [showSunDirection]="uiState.showSunDirection"
  (altitudeBordersChange)="facade.onToggleAltitudeBorders($event, cdr)"
  (windDirectionToggleChange)="facade.onToggleWindDirection($event, cdr)"
  (sunDirectionToggleChange)="facade.onToggleSunDirection($event, cdr)"
  (centerPlane)="followNearestPlane($event)"
  (centerAirport)="facade.onCenterAirport($event)"
  (hoverPlane)="facade.onHoverOverlayPlane($event)"
  (unhoverPlane)="facade.onUnhoverOverlayPlane($event)"
></app-results-overlay>

<div
  class="info-wrapper"
  [class.dateTimeHidden]="!uiState.showDateTime"
  [class.window-view-hidden]="!uiState.showWindowView"
  [class.left-bar-visible]="!inputOverlayComponent.otherControlsHidden"
  [class.results-expanded]="!resultsOverlayComponent.collapsed"
>
  <app-angle-overlay
    [sunAngle]="astronomicalDisplay.sunAngle"
    [sunEventText]="astronomicalDisplay.sunEventText"
    [isNight]="astronomicalDisplay.isNight"
    [moonPhaseName]="astronomicalDisplay.moonPhaseName"
    [moonFraction]="astronomicalDisplay.moonFraction"
    [windAngle]="facade.windAngle"
    [windStat]="facade.windStat"
    [windSpeed]="facade.getCurrentWindSpeed()"
    [windUnit]="facade.getCurrentWindUnit()"
    [windDirection]="facade.getWindFromDirection(facade.windAngle)"
    [showWindDirection]="uiState.showWindDirection"
    [showSunDirection]="uiState.showSunDirection"
    (cycleWindUnit)="facade.cycleWindUnit()"
  ></app-angle-overlay>
  <div class="time-temp-container" *ngIf="uiState.showDateTime">
    <app-clock></app-clock>
    <app-temperature
      [resultsCollapsed]="resultsOverlayComponent.collapsed"
    ></app-temperature>
  </div>
</div>

<app-window-view-overlay
  *ngIf="uiState.showWindowView"
  [windowViewPlanes]="overlay.windowViewPlanes"
  [highlightedPlaneIcao]="overlay.highlightedPlaneIcao"
  [observerLat]="facade.observerLat"
  [observerLon]="facade.observerLon"
  [isAtHome]="facade.isAtHome"
  [showAltitudeBorders]="uiState.showAltitudeBorders"
  [animationsEnabled]="uiState.animationsEnabled"
  [windStat]="facade.windStat"
  (selectPlane)="followNearestPlane($event)"
></app-window-view-overlay>

<div id="map"></div>

<app-cone
  *ngIf="map && uiState.coneVisible"
  [map]="map"
  [lat]="facade.isAtHome && facade.homeLocationValue ? facade.homeLocationValue.lat : facade.currentLat"
  [lon]="facade.isAtHome && facade.homeLocationValue ? facade.homeLocationValue.lon : facade.currentLon"
  [distanceKm]="facade.radiusKm"
  [viewCones]="facade.isAtHome ? viewConesConfig : []"
></app-cone>

<app-cone-config-editor
  *ngIf="showConeConfigEditor"
  [cones]="viewConesConfig"
  (conesChange)="facade.onConeConfigChange($event, cdr)"
  (closeEditor)="facade.onConeConfig()"
></app-cone-config-editor>
